services:
  - type: web
    name: semai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # you paste this in Render dashboard
      - key: ELEVENLABS_API_KEY
        sync: false          # add later when you get the key
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # secret — backend only, never in frontend
      - key: SUPABASE_ANON_KEY
        sync: false
